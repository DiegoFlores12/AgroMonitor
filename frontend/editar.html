<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Editar - AgroMonitor</title><link rel="stylesheet" href="css/estilos.css?v=20261017-05"></head>
<body class="dashboard-page" data-solo-admin="true">
    <div class="contenedor">
        <nav class="navbar">
            <div class="logo"><span class="logo-marca"><img src="assets/AgroMonitorLogo.jpg" alt=""></span><span>AgroMonitor</span></div>
            <a href="index.html">Inicio</a><a href="agregar.html">Agregar Área</a><a href="editar.html" class="activo">Editar Área</a><a href="configuracion.html">Configuración</a>
            <div class="menu-cuenta" data-menu-cuenta>
                <button class="usuario-sesion" id="boton-menu-cuenta" type="button" aria-label="Abrir menú de usuario" aria-haspopup="true" aria-expanded="false" aria-controls="menu-cuenta"><span class="usuario-inicial" id="usuario-inicial" aria-hidden="true">U</span><span id="usuario-actual">Usuario</span></button>
                <div class="menu-cuenta-desplegable" id="menu-cuenta" role="menu" hidden><span class="menu-cuenta-nombre" id="usuario-menu-nombre">Usuario</span><button class="boton-cerrar-sesion" id="boton-cerrar-sesion" type="button" role="menuitem">Cerrar sesión</button></div>
            </div>
            <div class="reloj-caja"><span class="reloj-etiqueta">Hora local</span><time id="reloj-digital" class="reloj-digital" aria-label="Hora local"></time></div>
        </nav>
        <h2>Modificar / Eliminar Área</h2>
        <table id="tabla-editar">
            <thead><tr><th>Área</th><th>Cultivo</th><th>Acciones</th></tr></thead>
            <tbody></tbody>
        </table>
        <div id="form-editar-caja" class="formulario-caja oculto" style="margin-top: 20px;">
            <h3>Editar Cultivo</h3>
            <form id="form-editar">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label>Nombre</label><input type="text" id="edit-nombre"></div>
                <div class="form-group"><label>Riego (horas)</label><input type="number" id="edit-riego"></div>
                <button type="button" id="btn-guardar-edicion" class="btn">Guardar</button>
                <button type="button" id="btn-cancelar" class="btn btn-danger">Cancelar</button>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script><script src="js/permisos.js?v=20261017-09"></script><script src="js/editar.js"></script><script src="js/interacciones.js"></script>
</body>
</html>
